<text x="56.0" y="231.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">mid=2 holds 3 &lt; 9 → the answer lives right: lo=3. Next mid=4 holds 9 — found. The</text>
<text x="56.0" y="250.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">overflow-safe midpoint is lo + (hi−lo)/2, and the loop runs while lo ≤ hi.</text>
